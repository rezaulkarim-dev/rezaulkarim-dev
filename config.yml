# Theme: Customizing the dark theme to match your Neon Green preference
theme:
  dark: "deep-sky"
  light: "deep-sky"
  void: "#0d1117"            # GitHub native dark mode background
  synapse_cyan: "#00ff41"    # Matrix Neon Green for the active stars/dust

# Motion: set to false for still images.
motion: true

# Stats configuration
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "repos"

# Language display settings
languages:
  exclude:                     
    - "Shell"
    - "Makefile"
  max_display: 8
